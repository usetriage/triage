<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Triage</title>
<style>
  /* tokens from web/src/styles.css — the splash ships without the SPA's CSS */
  :root {
    --canvas: #000000; --card: #0a0a0c; --elev: #101012;
    --hair: rgba(255, 255, 255, 0.06); --hair-strong: rgba(255, 255, 255, 0.14); --hair-bright: rgba(255, 255, 255, 0.28);
    --ink: #fcfdff; --body: rgba(252, 253, 255, 0.86); --mute: #a1a4a5; --ash: #888e90; --stone: #464a4d;
    --red: #ff2047; --tint-red: rgba(255, 32, 71, 0.1); --edge-red: rgba(255, 32, 71, 0.36); --red-ink: #ff7a92;
    --primary-hover: #f1f7fe;
    --sans: Geist, Inter, -apple-system, system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --r: 8px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--canvas); color: var(--ink); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  body { display: flex; align-items: center; justify-content: center; user-select: none; cursor: default; }
  main { width: min(560px, 100% - 48px); display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .lockup { height: 44px; width: auto; display: block; }
  .status { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--ash); min-height: 18px; }
  .dot { width: 6px; height: 6px; border-radius: 9999px; background: var(--ash); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  .error { display: none; width: 100%; flex-direction: column; gap: 12px; }
  .error .head { color: var(--ink); font-size: 14px; font-weight: 500; text-align: center; }
  .error pre {
    margin: 0; max-height: 240px; overflow: auto; background: var(--tint-red); color: var(--red-ink);
    border: 1px solid var(--edge-red); border-radius: var(--r); padding: 10px 13px;
    font: 12px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; cursor: text;
  }
  .error pre:empty { display: none; }
  .actions { display: flex; justify-content: center; gap: 8px; }
  button {
    display: inline-flex; align-items: center; justify-content: center; height: 30px; padding: 0 12px;
    border-radius: var(--r); border: 1px solid var(--hair-strong); background: var(--elev); color: var(--ink);
    font: 500 13px var(--sans); cursor: pointer; transition: background 0.1s ease, border-color 0.1s ease;
  }
  button:hover { border-color: var(--hair-bright); }
  button.primary { background: var(--ink); color: #000; border-color: var(--ink); }
  button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  button:focus-visible { outline: 2px solid var(--hair-bright); outline-offset: 2px; }
  .version { position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; font: 11px var(--mono); color: var(--stone); }
  body.failed .status { display: none; }
  body.failed .error { display: flex; }
</style>
</head>
<body>
<main>

      <path d="M9 40 L25 12.3" /><path d="M20 40 L30 22.7" /><path d="M31 40 L36 31.3" />

  </svg>
  <div class="status"><span class="dot"></span><span id="text">Looking for triage…</span></div>
  <div class="error" role="alert">
    <div class="head" id="head">Couldn’t start triage</div>
    <pre id="detail"></pre>
    <div class="actions">
      <button class="primary" id="retry">Retry</button>
      <button id="log">Open log</button>
    </div>
  </div>
</main>
<div class="version" id="version"></div>
<script>
  const d = window.triageDesktop
  const $ = (id) => document.getElementById(id)
  if (d) {
    if (d.version) $('version').textContent = 'Triage ' + d.version
    $('retry').addEventListener('click', () => d.retry())
    $('log').addEventListener('click', () => d.openLog())
    d.onStatus((s) => {
      document.body.classList.toggle('failed', s.state === 'error')
      if (s.state === 'error') {
        $('head').textContent = s.text
        $('detail').textContent = s.detail || ''
        $('retry').focus()
      } else {
        $('text').textContent = s.text
      }
    })
  }
</script>
</body>
</html>
