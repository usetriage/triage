# Builds Triage.app for both Mac architectures on a release tag and attaches
# the zips to that tag's GitHub release, where install.sh downloads them.
#
# /release pushes the tag before it creates the release, so each job builds
# first and then waits for the release to exist. Creating the release is not
# this workflow's job.
name: desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. v1.0.4)
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  app:
    name: Triage.app (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$TAG does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # The bundled Node tarball; build.mjs checks it against SHASUMS256 every run.
      - uses: actions/cache@v4
        with:
          path: desktop/.cache/node
          key: desktop-node-${{ matrix.arch }}-${{ hashFiles('desktop/scripts/build.mjs') }}

      - run: npm ci
      - run: npm --prefix desktop ci
      - run: npm run app:build -- --arch ${{ matrix.arch }}

      - name: Check the artifact
        run: |
          zip="desktop/release/Triage-$VERSION-mac-${{ matrix.arch }}.zip"
          test -f "$zip"
          ls -lh "$zip"
          rm -rf /tmp/check && ditto -x -k "$zip" /tmp/check
          codesign --verify --deep --strict /tmp/check/Triage.app
          lipo -archs /tmp/check/Triage.app/Contents/MacOS/Triage

      - name: Wait for the release
        run: |
          for _ in $(seq 1 60); do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
            echo "no release $TAG yet, waiting"
            sleep 30
          done
          echo "::error::release $TAG never appeared — run /release, then re-run this job"
          exit 1

      - name: Upload
        run: gh release upload "$TAG" "desktop/release/Triage-$VERSION-mac-${{ matrix.arch }}.zip" --repo "$GITHUB_REPOSITORY" --clobber
